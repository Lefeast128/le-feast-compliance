name: EHO API tenant isolation

on:
  push:
    branches:
      - "codex/verify-eho-*"
  pull_request:
    branches:
      - codex/pwa-foundation

permissions:
  contents: read

jobs:
  api-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      EHO_API_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eho_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Run authenticated API and database isolation tests
        run: npm run test:api-tenant-isolation-local
